name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile, test and package
        shell: pwsh
        run: ./package.ps1
      - name: Validate tag matches executable version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Item ./dist/CodexRings.exe).VersionInfo.ProductVersion
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag and binary version do not match." }
      - name: Publish executable, ZIP and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem ./dist -File | Where-Object { $_.Extension -in '.exe', '.zip', '.txt' } | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "Codex Rings $env:RELEASE_TAG" --notes-file "docs/RELEASE-$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
